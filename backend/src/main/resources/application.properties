# ── Database ──────────────────────────────────────────────────────────────────
# Set DATABASE_URL to your Supabase direct connection string:
# jdbc:postgresql://db.{ref}.supabase.co:5432/postgres
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ── Supabase ───────────────────────────────────────────────────────────────────
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:renderdeck-assets}

# ── JWT validation via Supabase JWKS ──────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}

# ── CORS ───────────────────────────────────────────────────────────────────────
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── File uploads ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
